{% extends 'base.html' %}{% block title %}Create account{% endblock %}{% block content %}<section class="auth-card"><div class="eyebrow">START YOUR WORKSPACE</div><h1>Create your account</h1><p class="muted">A username, a strong password, and you're ready.</p><form method="post" class="stack-form"><input type="hidden" name="_csrf_token" value="{{ csrf_token }}"><label>Username<input name="username" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9._-]+" placeholder="e.g. amarnath" required><small>3–32 characters: letters, numbers, dot, underscore or hyphen.</small></label><label>Password<input type="password" name="password" autocomplete="new-password" minlength="10" required><small>At least 10 characters.</small></label><button class="button primary full" type="submit">Create account →</button></form><p class="auth-foot">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></section>{% endblock %}
