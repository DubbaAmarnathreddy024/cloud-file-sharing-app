{% extends 'base.html' %}{% block title %}Log in{% endblock %}{% block content %}<section class="auth-card"><div class="eyebrow">WELCOME BACK</div><h1>Log in to CloudShare</h1><p class="muted">Access your files and shared items.</p><form method="post" class="stack-form"><input type="hidden" name="_csrf_token" value="{{ csrf_token }}"><label>Username<input name="username" autocomplete="username" minlength="3" maxlength="32" required autofocus></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button class="button primary full" type="submit">Log in →</button></form><p class="auth-foot">New here? <a href="{{ url_for('signup') }}">Create an account</a></p></section>{% endblock %}
